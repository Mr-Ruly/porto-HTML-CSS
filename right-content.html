<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materi Fullstack</title>
    <!-- Link ke Font Awesome untuk ikon sosial media -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        /* Reset margin dan padding untuk konsistensi */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }

        fieldset {
            background: linear-gradient(135deg, #6a11cb, #2575fc); /* Gradasi ungu-biru yang keren */
            border: none;
            border-radius: 15px;
            padding: 30px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease-in-out;
        }

        fieldset:hover {
            transform: scale(1.05); /* Efek pembesaran saat hover */
        }

        legend {
            font-size: 2em;
            font-weight: bold;
            color: white;
            text-align: center;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            margin: 20px 0;
            text-align: center;
        }

        a {
            text-decoration: none;
            color: #fff;
            font-size: 1.2em;
            font-weight: 600;
            display: block;
            padding: 12px 20px;
            border-radius: 30px;
            background-color: #34495e;
            transition: all 0.3s ease-in-out;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
            width: fit-content;
            margin: 0 auto;
        }

        a i {
            margin-right: 10px;
            font-size: 1.5em;
        }

        a:hover {
            background-color: #1abc9c; /* Warna hijau cerah */
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(26, 188, 156, 0.3);
        }

        /* Responsif untuk layar lebih kecil */
        @media (max-width: 600px) {
            fieldset {
                padding: 20px;
            }

            legend {
                font-size: 1.6em;
            }

            a {
                font-size: 1.1em;
            }
        }
    </style>
</head>
<body>
    <fieldset>
        <legend>Materi Fullstack</legend>
        <ul>
            <li><a href="https://www.codepolitan.com/course/intro/basic-html-dan-css/" target="_blank" rel="noopener noreferrer"><i class="fab fa-html5"></i> HTML & CSS </a></li>
            <li><a href="https://www.petanikode.com/javascript-dasar/" target="_blank" rel="noopener noreferrer"><i class="fab fa-js-square"></i> JavaScript</a></li>
            <li><a href="https://www.rumahweb.com/journal/belajar-php-mysql-tutorial-dasar/" target="_blank" rel="noopener noreferrer"><i class="fab fa-php"></i> PHP & MySQL</a></li>
            <li><a href="https://www.dicoding.com/blog/apa-itu-node-js/" target="_blank" rel="noopener noreferrer"><i class="fab fa-node"></i> Node JS </a></li>
            <li><a href="https://www.codepolitan.com/blog/belajar-react-js-pemula/" target="_blank" rel="noopener noreferrer"><i class="fab fa-react"></i> React JS</a></li>
        </ul>
    </fieldset>
</body>
</html>
