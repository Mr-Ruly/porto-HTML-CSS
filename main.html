<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Pribadi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }
        .profile-container {
            background: rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            backdrop-filter: blur(10px);
        }
        .profile-container img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 3px solid white;
            margin-bottom: 15px;
        }
        .profile-container h2 {
            margin-bottom: 10px;
        }
        .profile-container p {
            color: #e0e0e0;
            margin-bottom: 10px;
        }
        .profile-container a {
            display: inline-block;
            text-decoration: none;
            color: white;
            background: #ff7eb3;
            padding: 10px 20px;
            border-radius: 25px;
            transition: 0.3s;
        }
        .profile-container a:hover {
            background: #ff4e90;
        }
    </style>
</head>
<body>
    <div class="profile-container">
        <img src="images/profile.jpg" alt="Foto Profil">
        <h2>Ruly Setiaji</h2>
        <p>Saya seorang pekerja keras yang selalu berusaha menyelesaikan tugas dengan cepat dan tepat. Mudah beradaptasi dengan lingkungan baru.</p>
        <p>Email: Rulysaja03@gmail.com</p>
        <a>Hubungi Saya</a>
    </div>
</body>
</html>
