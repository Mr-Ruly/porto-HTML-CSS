<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Menu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f6f9;
        }
        .nav-menu {
            display: flex;
            justify-content: center;
            gap: 30px;
            background: linear-gradient(135deg, #6a11cb, #2575fc); /* Gradasi ungu ke biru */
            padding: 12px 0;
            width: 100%;
            height: 60px;
            align-items: center;
            border-bottom: 2px solid #2c3e50;
            position: relative;
        }
        .nav-menu a {
            color: white;
            text-decoration: none;
            font-size: 1.1em;
            font-weight: bold;
            padding: 12px 25px;
            background-color: transparent;
            border-radius: 25px;
            transition: all 0.3s ease-in-out;
        }
        .nav-menu a:hover {
            background-color: #16a085;
            transform: translateY(-5px);
        }
        @media (max-width: 768px) {
            .nav-menu {
                flex-direction: column;
                height: auto;
            }
            .nav-menu a {
                padding: 10px 20px;
            }
        }
    </style>
</head>
<body>
    <nav class="nav-menu">
        <a href="main.html" target="main">Home</a>
        <a href="study.html" target="main">MyStudy</a>
        <a href="galery.html" target="main">Gallery</a>
    </nav>
</body>
</html>
