<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Hobi Saya</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #4e54c8, #8f94fb); /* Gradasi warna biru ke ungu */
            color: #fff;
            padding: 30px;
            text-align: center;
        }

        h2 {
            font-size: 3em;
            margin-bottom: 30px;
            font-weight: bold;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        }

        .gallery-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 4 kolom */
            gap: 20px;
            max-width: 1200px;
            margin: auto;
            padding: 10px;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0px 6px 12px rgba(0, 0, 0, 0.1);
            transition: box-shadow 0.3s ease, transform 0.3s ease;
            background: #fff;
        }

        .gallery-item img {
            width: 100%;
            height: 250px; /* Menetapkan tinggi gambar sama */
            object-fit: cover; /* Agar gambar terpotong dengan proporsional */
            transition: transform 0.3s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.05); /* Memperbesar gambar saat hover */
        }

        .gallery-item::after {
            content: 'Klik untuk melihat lebih banyak';
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            background-color: rgba(0, 0, 0, 0.6);
            color: #fff;
            text-align: center;
            padding: 10px;
            font-size: 1.2em;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .gallery-item:hover::after {
            opacity: 1; /* Menampilkan teks overlay saat hover */
        }

        /* Menambahkan teks di bawah gambar */
        .gallery-item .caption {
            padding: 10px;
            font-size: 1.2em;
            background: linear-gradient(135deg, #f7b42c, #fc575e); /* Gradasi warna di bawah gambar */
            color: #fff;
            border-radius: 0 0 12px 12px;
            text-transform: uppercase;
        }

        @media (max-width: 1024px) {
            .gallery-container {
                grid-template-columns: repeat(3, 1fr); /* 3 kolom pada layar lebih kecil */
            }
        }

        @media (max-width: 768px) {
            .gallery-container {
                grid-template-columns: 1fr 1fr; /* 2 kolom pada perangkat kecil */
            }
        }

        @media (max-width: 480px) {
            .gallery-container {
                grid-template-columns: 1fr; /* 1 kolom pada perangkat lebih kecil */
            }
        }
    </style>
</head>
<body>

    <h2>Galeri Hobi Saya</h2>

    <div class="gallery-container">
        <div class="gallery-item">
            <img src="images/hobby1.jpeg" alt="Hobi 1">
            <div class="caption">Memancing</div>
        </div>
        <div class="gallery-item">
            <img src="images/hobby2.jpg" alt="Hobi 2">
            <div class="caption">Gaming</div>
        </div>
        <div class="gallery-item">
            <img src="images/hobby3.jpg" alt="Hobi 3">
            <div class="caption">Belajar</div>
        </div>
        <div class="gallery-item">
            <img src="images/hobby4.jpg" alt="Hobi 4">
            <div class="caption">Musik</div>
        </div>
    </div>

</body>
</html>
