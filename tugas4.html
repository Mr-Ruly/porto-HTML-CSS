<!DOCTYPE html>
<html>
<head>
    <title>Layout Frameset</title>
</head>
<frameset rows="15%,10%,*,10%" border="1">
    <frame src="header.html" name="header" noresize scrolling="no">
    <frame src="nav-menu.html" name="menu" noresize scrolling="no">
    <frameset cols="20%,*,20%">
        <frame src="left-content.html" name="left" noresize>
        <frame src="main.html" name="main">
        <frame src="right-content.html" name="right" noresize>
    </frameset>
    <frame src="footer.html" name="footer" noresize scrolling="no">
</frameset>
</html>
